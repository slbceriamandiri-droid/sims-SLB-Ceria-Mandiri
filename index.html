<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS SLB Ceria Mandiri Blora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media print {
            .no-print, #sidebar, #admin-bar-container, .form-container, .action-buttons, .edit-btn, .del-btn { display: none !important; }
            #main-content-area { margin-left: 0 !important; width: 100% !important; background: white; padding: 0 !important; }
            .print-table { width: 100%; border-collapse: collapse; }
            .print-table th, .print-table td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; }
            body { background: white; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
            .border { border-color: #000 !important; }
            .bg-white { background-color: transparent !important; }
            .pb-12 { padding-bottom: 0 !important; }
            .h-[75vh], .max-h-[75vh] { height: auto !important; max-height: none !important; overflow: visible !important; }
        }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 no-print z-30 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-4">
            <div class="flex items-center gap-3 mb-6 px-2">
                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md">
                    <i class="fas fa-school"></i>
                </div>
                <div>
                    <h1 class="font-black text-slate-800 text-sm leading-tight">SIMS SLB</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Ceria Mandiri</p>
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-6 flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0">
                    <i class="fas fa-user-circle text-lg"></i>
                </div>
                <div class="overflow-hidden">
                    <p id="sidebar-user-name" class="font-bold text-xs text-slate-800 truncate">Loading...</p>
                    <p id="sidebar-user-role" class="text-[10px] font-bold text-indigo-600 uppercase mt-0.5">...</p>
                </div>
            </div>

            <nav id="sidebar-menu" class="space-y-1 custom-scrollbar overflow-y-auto max-h-[calc(100vh-230px)] pr-1">
                <!-- Dynamic Menu Injected via JS -->
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100">
            <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 py-2.5 rounded-xl font-bold text-xs transition">
                <i class="fas fa-sign-out-alt"></i> Keluar Aplikasi
            </button>
        </div>
    </aside>

    <!-- MAIN APP WRAPPER -->
    <div id="app-container" class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <div id="admin-bar-container" class="no-print"></div>
        <main id="main-content-area" class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-slate-50">
            <!-- Dynamic Content -->
        </main>
    </div>

    <!-- MODAL PREVIEW DOKUMEN (VIEWER) -->
    <div id="modal-file-viewer" class="fixed inset-0 bg-slate-900/90 z-[100] hidden flex-col no-print backdrop-blur-sm">
        <div class="flex justify-between items-center p-4 bg-slate-800 border-b border-slate-700 text-white shadow-xl">
            <div class="flex items-center gap-3">
                <div id="viewer-icon" class="w-10 h-10 rounded-lg flex items-center justify-center text-xl bg-slate-700"></div>
                <div>
                    <h3 id="viewer-title" class="font-bold text-sm truncate max-w-[200px] md:max-w-md">Dokumen</h3>
                    <p id="viewer-type" class="text-[10px] text-slate-400 font-medium">Loading...</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a id="viewer-download-btn" href="#" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg">
                    <i class="fas fa-download"></i> <span class="hidden md:inline">Unduh Asli</span>
                </a>
                <button onclick="window.closeModal('modal-file-viewer')" class="w-10 h-10 rounded-lg bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center transition shadow-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>

        <div id="viewer-content-area" class="flex-1 p-4 md:p-8 flex items-center justify-center overflow-hidden">
            <!-- Content Injected Here -->

    <!-- MODAL UPLOAD FILE GLOBAL -->
    <div id="modal-add-file" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl scale-95 transform transition-transform">
            <div class="bg-indigo-600 p-4 text-white font-bold flex justify-between items-center">
                <span id="modal-file-title-head"><i class="fas fa-cloud-upload-alt mr-2"></i> Unggah File Dokumen</span>
                <button onclick="window.closeModal('modal-add-file')" class="text-white hover:text-indigo-200 transition"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="window.saveExplorerFile(event)" class="p-6 space-y-4">

                <div id="ex-file-title-container">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Judul / Nama File</label>
                    <input type="text" id="ex-file-title" required class="w-full bg-slate-50 border rounded-lg px-4 py-2 text-sm outline-none focus:border-indigo-500 transition">
                </div>
                <div id="ex-file-student-container">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Siswa Terkait (Opsional)</label>
                    <select id="ex-file-student" class="w-full bg-slate-50 border rounded-lg px-4 py-2 text-sm outline-none focus:border-indigo-500 transition"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pilih File dari Komputer</label>
                    <input type="file" id="ex-file-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,application/msword" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer transition">
                </div>
                <div id="upload-progress-status" class="text-xs font-bold text-indigo-600"></div>

    <!-- MODAL ADD FOLDER -->
    <div id="modal-add-folder" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl scale-95 transform transition-transform">
            <div class="bg-amber-500 p-4 text-white font-bold flex justify-between items-center">
                <span><i class="fas fa-folder-plus mr-2"></i> Buat Folder Baru</span>
                <button onclick="window.closeModal('modal-add-folder')" class="hover:text-amber-100 transition"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="window.saveExplorerFolder(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Folder</label>
                    <input type="text" id="ex-folder-name" required placeholder="Misal: RPP Semester 1" class="w-full bg-slate-50 border rounded-lg px-4 py-2 text-sm outline-none focus:border-amber-500 transition">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-md transition">Buat Folder</button>
            </form>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
            <div class="text-center mb-8 mt-2">
                <div class="w-16 h-16 bg-indigo-100 rounded-2xl mx-auto flex items-center justify-center mb-4 transform rotate-12 shadow-inner">
                    <i class="fas fa-school text-3xl text-indigo-600 -rotate-12"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">SIMS Ceria Mandiri</h1>
                <p class="text-sm text-slate-500 font-medium mt-1">Sistem Administrasi Guru Digital</p>
            </div>
            <form onsubmit="window.handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 ml-1 uppercase tracking-wider">Akses Sebagai</label>
                    <select id="login-role" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm font-medium transition cursor-pointer">
                        <option value="Guru Kelas">Guru Kelas</option>
                        <option value="Guru Stimulasi">Guru Stimulasi Khusus</option>
                        <option value="Super Admin">Super Admin (Kepsek)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 ml-1 uppercase tracking-wider">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-user text-slate-400"></i></div>
                        <input type="text" id="login-user" required class="w-full p-3 pl-10 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm transition" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 ml-1 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-slate-400"></i></div>
                        <input type="password" id="login-pass" required class="w-full p-3 pl-10 pr-10 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm transition" placeholder="••••••••">
                        <button type="button" onclick="window.togglePassword('login-pass')" class="absolute right-3 top-3.5 text-slate-400 hover:text-indigo-500 transition">
                            <i class="fas fa-eye" id="login-pass-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-black py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 text-sm">
                    Masuk Aplikasi <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const supabaseUrl = 'https://enmaccvxqdchenccoigm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVubWFjY3Z4cWRjaGVuY2NvaWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NTYyNzcsImV4cCI6MjA5OTAzMjI3N30.6n9DB6-aTRyp5I19DzWhlsOPOEONY4Tt2c9n6Vh-Vow';
        window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        window.state = { 
            currentUser: null, 
            currentView: 'dashboard', 
            selectedTeacherId: null, 
            penilaianTab: 'harian',
            penilaianMonth: null,
            editModalData: null,
            editEkstraData: null,
            stimulasiRows: [{program: '', aktivitas: ''}],
            attMonth: null,
            activeFolder_materials: '_ROOT_',
            activeFolder_evaluasi: '_ROOT_',
            studentSearchQuery: '',
            rekapStudentId: null,
            rekapMonth: null
        };
        
        window.localDb = { 
            teachers: [], students: [], attendance: [], journals: [], progsus: [], 
            jurnalStimulasi: [], penilaian: [], studentDocs: [], materials: [], evaluasiArsip: []
        };

        window.generateId = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });

        window.getToday = () => { 
            const d = new Date(); 
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; 
        };

        window.calculateAge = (birthDateString) => {
            if (!birthDateString) return '-';
            const today = new Date();
            const birthDate = new Date(birthDateString);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age >= 0 ? `${age} thn` : '-';
        };

        window.showToast = (msg, type = 'success') => {
            const toast = document.createElement('div');
            let bgClass = 'bg-emerald-500';
            let iconClass = 'fa-check-circle';
            if(type === 'error') { bgClass = 'bg-rose-500'; iconClass = 'fa-exclamation-circle'; }
            else if(type === 'info') { bgClass = 'bg-amber-500'; iconClass = 'fa-info-circle'; }
            
            toast.className = `fixed bottom-4 right-4 text-white px-6 py-3 rounded-xl shadow-2xl z-[200] fade-in font-bold flex items-center ${bgClass}`;
            toast.innerHTML = `<i class="fas ${iconClass} mr-2"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        };

        window.togglePassword = (inputId) => {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            if (input.type === 'password') {
                input.type = 'text'; icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password'; icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye');
            }
        };

        window.closeModal = (id) => {
            const el = document.getElementById(id);
            if(el) el.classList.add('hidden');
        };

        // EXPORT TO EXCEL FUNCTIONS
        window.exportToCSV = (filename, rows) => {
            let csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.exportTableToCSV = (tableId, filename) => {
            const table = document.getElementById(tableId);
            if(!table) return;
            let rows = [];
            for (let i = 0; i < table.rows.length; i++) {
                let row = [], cols = table.rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) {
                    let input = cols[j].querySelector('input, select');
                    if(input) row.push(`"${input.value.replace(/"/g, '""')}"`);
                    else row.push(`"${cols[j].innerText.replace(/"/g, '""')}"`);
                }
                rows.push(row.join(","));
            }
            const csvContent = "data:text/csv;charset=utf-8," + rows.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.exportProgsusToCSV = () => {
            const data = (window.localDb.progsus||[]).filter(p => p.teacherId === (window.state.selectedTeacherId || window.state.currentUser.id));
            let rows = [["Tanggal", "Siswa", "Materi Progsus", "Keterangan / Hasil", "Status Dokumen"]];
            data.forEach(p => rows.push([p.date, p.student, p.materi, p.desc, p.status]));
            window.exportToCSV("Rekap_Program_Khusus", rows);
        };

        window.loadAppData = async () => {
            try {
                const tables = Object.keys(window.localDb);
                const batchSize = 3;
                for (let i = 0; i < tables.length; i += batchSize) {
                    const batch = tables.slice(i, i + batchSize);
                    await Promise.all(batch.map(async (table) => {
                        try {
                            const { data, error } = await window.supabaseClient.from(table).select('*').order('id', { ascending: true });
                            if (error) throw error;
                            window.localDb[table] = data || [];
                        } catch (err) { console.warn(`Error loading ${table}:`, err.message); }
                    }));
                }
            } catch (err) { console.error("Gagal sinkronisasi data:", err); }
        };

        window.cleanAndMapDataForTable = (table, dataObj) => {
            const clean = { ...dataObj };
            Object.keys(clean).forEach(key => clean[key] === undefined ? delete clean[key] : {});
            if (table === 'attendance') {
                if (clean.studentId && !clean.student_id) clean.student_id = clean.studentId;
                if (clean.teacherId && !clean.teacher_id) clean.teacher_id = clean.teacherId;
                delete clean.student_id; delete clean.teacher_id;
            } else if (table === 'journals') {
                if (clean.hambatan === undefined) clean.hambatan = clean.perilaku || '';
                if (clean.solusi === undefined) clean.solusi = ''; 
                delete clean.perilaku; 
            } else if (table === 'materials') {
                if (clean.link === undefined) clean.link = clean.url || '';
                if (clean.title === undefined) clean.title = clean.name || 'Untitled';
                delete clean.url; delete clean.name;
            } else if (table === 'evaluasiArsip') {
                if (clean.link === undefined) clean.link = '';
            }
            return clean;
        };

        window.saveToCloud = async (table, id, dataObj, background = false) => {
            try {
                const mappedData = window.cleanAndMapDataForTable(table, dataObj);
                
                // 1. Simpan ke array lokal terlebih dahulu agar UI langsung terupdate
                const idx = window.localDb[table].findIndex(item => item?.id === id);
                if (idx > -1) window.localDb[table][idx] = { ...window.localDb[table][idx], ...dataObj, ...mappedData };
                else window.localDb[table].push({ ...dataObj, ...mappedData });

                // 2. Kemudian coba kirim ke server Supabase
                const { error } = await window.supabaseClient.from(table).upsert(mappedData);
                if (error) throw new Error(error.message);
                
                return true;
            } catch (error) {
                if(!background) {
                    if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        window.showToast(`Tersimpan secara lokal (Offline Mode). Koneksi ke server gagal.`, 'success');
                    } else {
                        window.showToast(`Gagal sinkron ke '${table}': ${error.message}`, 'error');
                    }
                }
                return true; 
            }
        };

        window.deleteFileItem = async (table, id, name = "Data") => {
            if(confirm(`Yakin ingin menghapus ${name} ini permanen?`)) {
                try {
                    const { error } = await window.supabaseClient.from(table).delete().eq('id', id);
                    if(error) throw error;
                    window.localDb[table] = window.localDb[table].filter(item => item?.id !== id);
                    window.showToast(`${name} berhasil dihapus.`);
                    window.renderApp();
                } catch (error) { window.showToast(`Gagal menghapus: ${error.message}`, 'error'); }
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memvalidasi...'; btn.disabled = true;

            const role = document.getElementById('login-role').value.trim();
            const user = document.getElementById('login-user').value.toLowerCase().trim();
            const pass = document.getElementById('login-pass').value.trim();

            let isWakingUp = setTimeout(() => {
                window.showToast("Koneksi lambat. Database mungkin sedang 'Wake Up'. Mohon tunggu...", 'info');
            }, 4000);

            try {
                let serverTeachers = [];
                const { data, error } = await window.supabaseClient.from('teachers').select('*');
                if (!error) serverTeachers = data || [];

                let teachersList = serverTeachers.length > 0 ? serverTeachers : [...(window.localDb.teachers || [])];
                let hasSuperAdmin = teachersList.some(t => (t?.role || '').trim() === 'Super Admin');
                
                if (!hasSuperAdmin) {
                    const adminData = { id: 'admin1', name: 'Kepala Sekolah', role: 'Super Admin', username: 'superadmin', password: 'admin123' };
                    if (!error) await window.supabaseClient.from('teachers').insert([adminData]).catch(e => console.warn(e));
                    teachersList.push(adminData);
                }
                window.localDb.teachers = teachersList;

                const account = teachersList.find(t => (t?.username || '').toLowerCase().trim() === user && (t?.password || '').trim() === pass && (t?.role || '').trim() === role);

                clearTimeout(isWakingUp);

                if (account) {
                    window.state.currentUser = account;
                    if(account.role === 'Super Admin') {
                        const firstTeacher = teachersList.find(t => t?.role !== 'Super Admin');
                        window.state.selectedTeacherId = firstTeacher ? firstTeacher.id : account.id;
                    } else {
                        window.state.selectedTeacherId = account.id;
                    }
                    
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    window.showToast(`Selamat datang, ${account.name}! Menyinkronkan data...`);
                    
                    window.renderApp(); 
                    
                    window.loadAppData().then(() => {
                        window.renderApp(); 
                    });
                } else {
                    window.showToast("Login Gagal! Periksa kembali Username, Password, atau Akses Sebagai.", 'error');
                }
            } catch (err) { 
                clearTimeout(isWakingUp);
                window.showToast(err.message, 'error'); 
            } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        };

        window.logout = () => {

        window.uploadStudentDoc = async (studentId, docField, fileInputId, statusId) => {
            const fileInput = document.getElementById(fileInputId);
            const statusEl = document.getElementById(statusId);
            const file = fileInput?.files[0];
            if(!file) return window.showToast('Pilih file dokumen terlebih dahulu!', 'error');

            const student = window.localDb.students.find(s => s?.id === studentId);
            if(!student) return;

            try {
                statusEl.innerHTML = '<span class="text-indigo-500"><i class="fas fa-spinner fa-spin mr-1"></i> Mengunggah...</span>';
                const ext = file.name.split('.').pop();
                const cleanName = (student.name || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
                const fileName = `${cleanName}_${docField}_${Date.now()}.${ext}`;

                const { data, error: uploadError } = await window.supabaseClient.storage.from('arsip-dokumen').upload(fileName, file, { upsert: true });
                if (uploadError) throw uploadError;

                const { data: publicUrlData } = window.supabaseClient.storage.from('arsip-dokumen').getPublicUrl(fileName);
                const fileUrl = publicUrlData.publicUrl;

                const updateData = {}; updateData[docField] = fileUrl;
                const { error: dbError } = await window.supabaseClient.from('students').update(updateData).eq('id', studentId);
                if(dbError) throw dbError;
                
                student[docField] = fileUrl;
                statusEl.innerHTML = '<span class="text-emerald-500"><i class="fas fa-check-circle mr-1"></i> Sukses Tersimpan</span>';
                window.showToast('Dokumen berhasil diunggah!');
                window.renderApp();
            } catch(err) {
                statusEl.innerHTML = `<span class="text-rose-500 text-[10px] font-bold" title="${err.message}"><i class="fas fa-times-circle mr-1"></i> Gagal</span>`;
                window.showToast('Gagal: ' + err.message, 'error');

        };

                if(el) {

            if(!confirm(`Yakin ingin menghapus kolom '${mapelName}' beserta semua nilainya?`)) return;
            
            let record = window.localDb.penilaian.find(p => p.id === recordId);
            if(!record) return;

            let aspects = JSON.parse(record.aspects || '[]');
            let scores = JSON.parse(record.scores || '{}');

            aspects = aspects.filter(a => a !== mapelName);
            record.aspects = JSON.stringify(aspects);

            Object.keys(scores).forEach(studentId => {
                if (record.type === 'harian') {
                    for(let i=1; i<=5; i++) {
                        delete scores[studentId][`${mapelName}_p${i}_P`];
                        delete scores[studentId][`${mapelName}_p${i}_K`];
                    }
                } 
                else {
                    delete scores[studentId][mapelName];
                }
            });
            record.scores = JSON.stringify(scores);

            if(await window.saveToCloud('penilaian', recordId, record, true)) {
                window.showToast(`Kolom ${mapelName} berhasil dihapus.`);
                window.renderApp();
            }

                    }

                                                            <th class="p-2 text-center border-b border-slate-300 font-bold uppercase tracking-widest text-xs bg-slate-200" colspan="${aspects.length}">Mapel / Tema</th>
                                                        </tr>
                                                        <tr class="bg-slate-50 text-slate-700">
                                                            ${aspects.map(c => `
                                                                <th class="p-2 text-center border-r border-b border-slate-300 font-bold min-w-[140px] text-xs relative group">
                                                                    <div class="flex items-center justify-between px-1">
                                                                        <span class="truncate flex-1" title="${c}">${c}</span>
                                                                        ${!readOnly ? `
                                                                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition no-print bg-slate-50 rounded pl-1 z-10">
                                                                            <button type="button" onclick="window.openEditMapel('${recordId}', '${c.replace(/'/g, "\\'")}')" class="w-6 h-6 rounded bg-indigo-100 hover:bg-indigo-600 text-indigo-600 hover:text-white flex items-center justify-center transition" title="Edit Mapel"><i class="fas fa-pen text-[9px]"></i></button>
                                                                            <button type="button" onclick="window.deleteMapel('${recordId}', '${c.replace(/'/g, "\\'")}')" class="w-6 h-6 rounded bg-rose-100 hover:bg-rose-600 text-rose-600 hover:text-white flex items-center justify-center transition" title="Hapus Mapel"><i class="fas fa-trash text-[9px]"></i></button>
                                                                        </div>` : ''}
                                                                    </div>
                                                                </th>
                                                            `).join('')}
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        ${targetStudents.length === 0 ? `<tr><td colspan="${aspects.length + 1}" class="text-center p-8 text-slate-400 border border-slate-300">Tidak ada data siswa.</td></tr>` : targetStudents.map(s => `
                                                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition last:border-b-0">
                                                            <td class="p-3 border-r border-slate-300 font-bold text-slate-800 sticky left-0 bg-white z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] truncate max-w-[150px]">${s.name}</td>
                                                            ${aspects.map(c => {
                                                                let val = scores[s.id] && scores[s.id][c] ? scores[s.id][c] : '';
                                                                return `<td class="p-1 border-r border-slate-300 text-center"><input type="text" value="${val}" ${readOnly?'disabled':''} onchange="window.updateScore('${recordId}', '${s.id}', '${c.replace(/'/g, "\\'")}', this.value)" class="w-full h-full text-center p-2 rounded outline-none focus:bg-indigo-50 border border-transparent focus:border-indigo-300 transition font-bold text-slate-800 bg-transparent text-sm" placeholder="-"></td>`;
                                                            }).join('')}
                                                        </tr>
                                                        `).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                `}
                            </div>
                        </div>

                        <!-- MODAL TAMBAH MAPEL (HARIAN) -->
                        <div id="add-penilaian-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
                            <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                                <div class="bg-indigo-600 p-4 text-white font-bold flex justify-between items-center">
                                    <span>Tambah Mapel / Tema</span>
                                    <button onclick="window.closeModal('add-penilaian-modal')" class="hover:text-slate-200 transition"><i class="fas fa-times"></i></button>
                                </div>
                                <form onsubmit="window.savePenilaianConfig(event)" class="p-6 space-y-4">
                                    <div><label class="block text-xs font-bold mb-1 text-slate-600">Nama Mata Pelajaran / Tema</label><input type="text" id="penilaian-mapel" placeholder="Misal: Bahasa / Tema Keluargaku" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-sm outline-none focus:border-indigo-500"></div>
                                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-bold shadow-md transition">Buat Kolom</button>
                                </form>
                            </div>
                        </div>
                    `;
                }

                else if (['materials', 'evaluasiArsip'].includes(window.state.currentView)) {
                    const col = window.state.currentView;
                    const activeFol = window.state[`activeFolder_${col}`] || '_ROOT_';
                    const items = (window.localDb[col]||[]).filter(m => (m?.teacherId === targetUid) && (col === 'materials' ? m?.category === activeFol : m?.type === activeFol));
                    
                    const titlesMap = { materials: 'Perangkat Belajar', evaluasiArsip: 'Arsip Evaluasi Siswa' };
                    const fd = activeFol !== '_ROOT_' ? (window.localDb[col]||[]).find(f => f?.id === activeFol) : null;
                    const fName = fd ? (fd.title || fd.notes) : titlesMap[col];

                    content.innerHTML = `<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"><div class="flex items-center gap-3">${activeFol !== '_ROOT_' ? `<button onclick="window.state['activeFolder_${col}'] = '_ROOT_'; window.renderApp()" class="w-10 h-10 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center transition shadow-sm relative z-10"><i class="fas fa-arrow-left"></i></button>` : ''}<h2 class="text-2xl font-black text-slate-800">${fName}</h2></div><div class="flex gap-2 w-full md:w-auto z-10">${!readOnly ? `<button onclick="document.getElementById('modal-add-folder').classList.remove('hidden')" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition flex items-center justify-center"><i class="fas fa-folder-plus mr-2"></i> Buat Folder</button><button onclick="window.openAddFileModal()" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm transition flex items-center justify-center"><i class="fas fa-file-upload mr-2"></i> Tambah Dokumen</button>` : ''}</div></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-12 relative z-0">${items.length===0?`<div class="col-span-full p-16 text-center text-slate-400 border border-slate-200 rounded-3xl bg-white shadow-sm"><i class="fas fa-folder-open text-6xl mb-4 opacity-20"></i><p class="font-medium text-lg mt-2">Folder ini masih kosong.</p></div>`:items.map(f=>{
                        const isF = (f?.link === '_FOLDER_');
                        const fileLink = f?.link || f?.url || '';
                        const titleText = f?.title || f?.notes || 'Dokumen';
                        
                        let ic = isF ? 'fa-folder text-amber-500 bg-amber-100' : 'fa-file-alt text-slate-500 bg-slate-100';
                        if (!isF && fileLink) {
                            if (fileLink.toLowerCase().includes('.pdf')) ic = 'fa-file-pdf text-rose-500 bg-rose-100';
                            else if (fileLink.toLowerCase().includes('.doc')) ic = 'fa-file-word text-blue-500 bg-blue-100';
                            else if (fileLink.match(/\.(jpg|jpeg|png|gif|webp)(?:\?|$)/i)) ic = 'fa-image text-emerald-500 bg-emerald-100';
                        }

                        const onCardClick = isF ? `window.state['activeFolder_${col}']='${f.id}'; window.renderApp()` : (fileLink ? `window.openFileViewer('${fileLink}', '${titleText.replace(/'/g, "\\'")}')` : '');
                        return `<div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 group relative cursor-pointer flex items-center justify-between hover:shadow-md hover:border-indigo-300 transition" onclick="${onCardClick}"><div class="flex items-center gap-4 truncate pr-4"><div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0 ${ic}"><i class="fas ${isF?'fa-folder':(fileLink.toLowerCase().includes('.pdf')?'fa-file-pdf':(fileLink.toLowerCase().includes('.doc')?'fa-file-word':(fileLink.match(/\.(jpg|jpeg|png|gif|webp)(?:\?|$)/i)?'fa-image':'fa-file-alt')))}"></i></div><div class="truncate"><h4 class="font-bold text-sm text-slate-800 truncate">${titleText}</h4><p class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">${isF?'Folder':'Dokumen'}</p></div></div><div class="flex gap-1 shrink-0 relative z-10">${!isF && fileLink ? `<a href="${fileLink}" target="_blank" onclick="event.stopPropagation()" class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white flex items-center justify-center transition shadow-sm" title="Unduh File"><i class="fas fa-download text-xs"></i></a>` : ''}${!readOnly ? `<button onclick="event.stopPropagation(); window.deleteFileItem('${col}', '${f.id}', 'Item')" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white flex items-center justify-center transition shadow-sm" title="Hapus"><i class="fas fa-trash text-xs"></i></button>` : ''}</div></div>`;
                    }).join('')}</div>`;
                }
            } catch(e) { console.error("Render Error:", e); }
        };

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => { 
            // Data di-load di latar belakang sesudah login agar initial load instan
        });
    </script>
</body>
</html>
